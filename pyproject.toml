[project]
name = "voice-to-notes"
version = "0.1.0"
description = "GPU-accelerated lecture transcription -> textbook-style Markdown -> PDF"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "faster-whisper>=1.1.0",
    # faster-whisper still passes av.open(metadata_errors=...), which newer PyAV removed
    "av>=11,<17",
    # CUDA runtime libraries used by CTranslate2 (the Whisper engine) on the GPU
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9,<10",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "playwright>=1.47",
]

[tool.uv]
# Not every nvidia-* release ships Windows wheels; make uv pick ones that do.
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
